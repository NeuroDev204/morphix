name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  tarball:
    needs: test
    runs-on: ubuntu-latest
    # WHY Ubuntu 22.04: glibc 2.35 là mức tối thiểu bản cài bằng lệnh curl hứa hỗ trợ.
    container: ubuntu:22.04
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: scripts/ci/setup-build-deps.sh
      - run: npm ci
        working-directory: crates/morphix-gui/ui
      # WHY /tmp/dist: trong container, runner.temp trỏ đường dẫn máy chủ; build-tarball.sh cấm đầu ra trong repo.
      - run: scripts/build-tarball.sh /tmp/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tarball
          path: /tmp/dist/morphix-x86_64-linux.tar.gz*
          if-no-files-found: error

  deb:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: scripts/ci/setup-build-deps.sh
      # WHY ghim phiên bản: prepare-ding.py kiểm đúng bản DING này.
      - run: |
          sudo apt-get install -y dpkg-dev
          version="$(python3 -c 'import json;print(json.load(open("integration/ding/source.json"))["version"])')"
          cd "$RUNNER_TEMP" && apt-get download "gnome-shell-extension-desktop-icons-ng=$version"
          dpkg-deb -x gnome-shell-extension-desktop-icons-ng_*.deb ding
      - run: npm ci
        working-directory: crates/morphix-gui/ui
      - run: scripts/build-deb.sh "$RUNNER_TEMP/dist"
        env:
          MORPHIX_DING_SOURCE: ${{ runner.temp }}/ding/usr/share/gnome-shell/extensions/ding@rastersoft.com
      - run: scripts/check-deb.sh "$RUNNER_TEMP"/dist/*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deb
          path: ${{ runner.temp }}/dist/*.deb
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # WHY dừng sớm: tag, Cargo.toml và tauri.conf.json phải cùng một phiên bản trước khi dựng gì.
      - id: version
        shell: pwsh
        run: |
          $version = python scripts/ci/check_version.py $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: ./scripts/ci/setup-windows-deps.ps1
        shell: pwsh
      - run: npm ci && npm run build
        working-directory: crates/morphix-gui/ui
      # WHY custom-protocol: thiếu nó thì binary nạp localhost:5173 thay vì nhúng ui/dist.
      - run: cargo build --locked --release -p morphix-cli -p morphix-gui -p morphix-shell --features morphix-gui/custom-protocol
      # WHY: như bản Linux, thiếu custom-protocol thì binary nạp localhost:5173 và cửa sổ báo lỗi kết nối.
      - run: ./scripts/ci/check-gui-embeds-ui.ps1 -Binary target/release/morphix-gui.exe
        shell: pwsh
      - run: ./scripts/ci/package-windows.ps1 -Version "${{ steps.version.outputs.version }}" -OutDir dist
        shell: pwsh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-setup
          path: dist/MorphixSetup.exe*
          if-no-files-found: error
      # WHY chỉ là artifact của workflow: gói này tải tay lên Partner Center, không phát hành trên GitHub.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: store-msix
          path: dist/Morphix-*.msix
          if-no-files-found: error

  publish:
    needs: [tarball, deb, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tarball
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: deb
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-setup
          path: dist
      # WHY kiểm trước: thiếu exe thì Release vẫn phát hành được nhưng trang tải về sẽ 404.
      - run: test -f dist/MorphixSetup.exe && test -f dist/MorphixSetup.exe.sha256
      - run: gh release create "$GITHUB_REF_NAME" dist/* scripts/install.sh --title "Morphix $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
