name: ffmpeg
# Dựng ffmpeg gọn cho Morphix (Linux và Windows) từ nguồn đã ghim SHA256, để bản dựng tái lập được trên CI.
# Chạy tay. `publish` bật thì đính kết quả vào release `ffmpeg-<ver>-morphix.<rev>` (bản thử), để
# packaging/ffmpeg-static.txt và packaging/windows-deps.txt trỏ tới.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Số bản dựng (hậu tố morphix.<rev> của tên gói)
        default: "2"
      publish:
        description: Đính kết quả vào release ffmpeg-<ver>-morphix.<rev>
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # WHY ubuntu:22.04: bản dựng tĩnh hoàn toàn nên không phụ thuộc glibc, nhưng thư viện codec lấy từ Ubuntu 22.04.
      - run: docker run --rm -e FFMPEG_REVISION=${{ inputs.revision }} -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/out:/out" ubuntu:22.04 bash /repo/scripts/build-ffmpeg-slim.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ffmpeg-linux
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  windows:
    # WHY chạy trên Linux: biên dịch chéo bằng mingw-w64 trong container, không cần máy Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker run --rm -e FFMPEG_REVISION=${{ inputs.revision }} -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/out:/out" debian:13 bash /repo/scripts/build-ffmpeg-slim-windows.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ffmpeg-windows
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish }}
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ffmpeg-linux
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ffmpeg-windows
          path: out
      - run: gh release create "ffmpeg-8.1.3-morphix.${{ inputs.revision }}" out/* --repo "$GITHUB_REPOSITORY" --prerelease --title "ffmpeg 8.1.3 (Morphix, bản ${{ inputs.revision }})" --notes "ffmpeg gọn dựng từ nguồn cho Morphix. Xem scripts/build-ffmpeg-slim*.sh và BUILD-INFO.txt trong gói."
        env:
          GH_TOKEN: ${{ github.token }}
