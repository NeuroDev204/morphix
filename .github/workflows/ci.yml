name: ci
on:
  push:
    branches: [main]
  pull_request:
  # WHY: release.yml chạy lại đúng bộ test này trước khi dựng gói.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: scripts/ci/setup-build-deps.sh
      # WHY không chạy cargo fmt --check toàn workspace: còn drift đã biết (CLAUDE.md), sửa riêng.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # WHY: chạy lại test core với đúng ffmpeg gọn mà tarball và .deb mang theo; thiếu nó thì test media bị bỏ qua
      # và một bộ mã hoá/muxer bị cắt nhầm chỉ lộ ra trên máy người dùng.
      - run: bash scripts/install-ffmpeg-slim.sh "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" "$RUNNER_TEMP/ffmpeg/doc" "$RUNNER_TEMP/ffmpeg/work"
      - env:
          MORPHIX_FFMPEG: ${{ runner.temp }}/ffmpeg/bin/ffmpeg
        run: cargo test -p morphix-core
      - run: npm ci && npm run check && npm test
        working-directory: crates/morphix-gui/ui
      - run: python3 -m unittest discover -s scripts/tests
      - run: python3 -m unittest discover -s integration/tests

  # WHY job riêng cho Windows: bản exe và gói Store phát hành từ đây, nên clippy và test phải chạy ở đúng nền tảng đó.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: ./scripts/ci/setup-windows-deps.ps1
        shell: pwsh
      # WHY: test media và ffmpeg tìm ffmpeg.exe qua PATH; bản tải về nằm trong installer\bundle.
      - run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $PWD "installer\bundle")
        shell: pwsh
      - run: npm ci && npm run build
        working-directory: crates/morphix-gui/ui
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
