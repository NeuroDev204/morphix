name: ci
on:
  push:
    branches: [main]
  pull_request:
  # WHY: release.yml chạy lại đúng bộ test này trước khi dựng gói.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: scripts/ci/setup-build-deps.sh
      # WHY không chạy cargo fmt --check toàn workspace: còn drift đã biết (CLAUDE.md), sửa riêng.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npm ci && npm run check && npm test
        working-directory: crates/morphix-gui/ui
      - run: python3 -m unittest discover -s scripts/tests
      - run: python3 -m unittest discover -s integration/tests

  # WHY job riêng cho Windows: bản exe và gói Store phát hành từ đây, nên clippy và test phải chạy ở đúng nền tảng đó.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: ./scripts/ci/setup-windows-deps.ps1
        shell: pwsh
      # WHY: test media và ffmpeg tìm ffmpeg.exe qua PATH; bản tải về nằm trong installer\bundle.
      - run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $PWD "installer\bundle")
        shell: pwsh
      - run: npm ci && npm run build
        working-directory: crates/morphix-gui/ui
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
