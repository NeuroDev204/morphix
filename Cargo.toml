[workspace]
resolver = "2"
members = [
    "crates/morphix-core",
    "crates/morphix-cli",
    "crates/morphix-gui",
    "crates/morphix-ipc",
    "crates/morphix-shell",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "GPL-3.0-or-later"

# WHY không panic = "abort": jobs.rs và capture/mod.rs bắt panic của luồng nền để app không sập.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
