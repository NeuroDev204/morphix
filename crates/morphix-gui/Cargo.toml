[package]
name = "morphix-gui"
version.workspace = true
license.workspace = true
edition.workspace = true

[lib]
name = "morphix_gui"

[[bin]]
name = "morphix-gui"
path = "src/main.rs"

[features]
# WHY: không bật feature này thì Tauri coi binary là bản dev và nạp devUrl (localhost:5173)
# thay vì nhúng ui/dist, nên cửa sổ báo "Connection refused". Bản release phải bật nó.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2"

[dependencies]
morphix-core = { path = "../morphix-core" }
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-dialog = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
morphix-ipc = { path = "../morphix-ipc" }
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.27.0"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
url = "2.5.8"
x11rb = { version = "0.13.2", features = ["xtest"] }
